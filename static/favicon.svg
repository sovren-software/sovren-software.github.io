<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <rect width="32" height="32" rx="4" fill="#1A1721"/>
  <!--
    Sovren Hexagonal Knot — Favicon (simplified, no weave at this scale)
    R=11, center=(16,16), pointy-top, stroke=1.4
  -->
  <g stroke="#8B7EC8" stroke-width="2" stroke-linecap="butt">
    <!-- Outer hexagon -->
    <polygon points="16,5 25.53,10.5 25.53,21.5 16,27 6.47,21.5 6.47,10.5"
             stroke-linejoin="miter" stroke-miterlimit="4"/>
    <!-- Triangle A: V0→V2, V2→V4, V4→V0 -->
    <line x1="16" y1="5" x2="25.53" y2="21.5"/>
    <line x1="25.53" y1="21.5" x2="6.47" y2="21.5"/>
    <line x1="6.47" y1="21.5" x2="16" y2="5"/>
    <!-- Triangle B: V1→V3, V3→V5, V5→V1 -->
    <line x1="25.53" y1="10.5" x2="16" y2="27"/>
    <line x1="16" y1="27" x2="6.47" y2="10.5"/>
    <line x1="6.47" y1="10.5" x2="25.53" y2="10.5"/>
  </g>
</svg>
