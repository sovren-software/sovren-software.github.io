name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment

  verify:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Wait for CDN propagation
        run: sleep 15

      - name: Verify site is live
        run: |
          STATUS=$(curl -sI -o /dev/null -w "%{http_code}" https://sovren.software/)
          echo "sovren.software returned HTTP $STATUS"
          if [ "$STATUS" -ne 200 ]; then
            echo "::error::Site returned $STATUS — expected 200. Check Pages config and custom domain."
            exit 1
          fi
